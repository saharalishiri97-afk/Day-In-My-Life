<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Day in My Life</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Day in My Life">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf4f6">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23362e2b'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%23d4a94f' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%23a8687a' stroke-width='6' stroke-dasharray='88 176' stroke-linecap='round' transform='rotate(-90 50 50)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #faf4f6;
    --card: #ffffff;
    --ink: #362e2b;
    --muted: #9c8f94;
    --divider: #efe3e6;
    --gold: #d4a94f;
    --gold-soft: #f1ddaf;
    --mauve: #a8687a;
    --mauve-soft: #f3e3e8;
    --shadow: 0 1px 2px rgba(54,46,43,0.04), 0 8px 24px rgba(54,46,43,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:28px 18px 8px;
  }
  header{
    margin-bottom:18px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--mauve);
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:34px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--muted);
    font-size:14px;
    margin:0;
  }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:18px 2px 10px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 14px 7px 8px;
    border-radius:999px;
    background:var(--card);
    border:1px solid var(--divider);
    cursor:pointer;
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--muted);
    transition:all .18s ease;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .ring{
    width:22px;
    height:22px;
    border-radius:50%;
    flex:0 0 22px;
  }

  .progress-line{
    height:6px;
    border-radius:999px;
    background:var(--divider);
    overflow:hidden;
    margin:6px 2px 22px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--mauve));
    border-radius:999px;
    transition:width .35s ease;
    width:0%;
  }

  .block{
    display:flex;
    gap:14px;
    margin-bottom:4px;
  }
  .time-col{
    flex:0 0 64px;
    padding-top:11px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    text-align:right;
    line-height:1.4;
  }
  .rail{
    flex:0 0 16px;
    display:flex;
    justify-content:center;
    position:relative;
  }
  .rail::before{
    content:"";
    position:absolute;
    top:8px;
    bottom:-4px;
    width:1.5px;
    background:var(--divider);
  }
  .block:last-child .rail::before{ display:none; }
  .rail-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--mauve);
    margin-top:14px;
    flex:0 0 7px;
  }
  .items{
    flex:1;
    padding-bottom:18px;
  }

  .item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:7px 10px;
    border-radius:12px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    transition:background .15s ease;
  }
  .item:hover{ background:var(--mauve-soft); }
  .item.done .item-text{
    color:var(--muted);
    text-decoration:line-through;
    text-decoration-color:var(--gold);
    text-decoration-thickness:1.5px;
  }

  .box{
    width:21px;
    height:21px;
    border-radius:50%;
    border:1.6px solid #d9cdd1;
    flex:0 0 21px;
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .16s ease;
    background:#fff;
  }
  .item.done .box{
    background:var(--gold);
    border-color:var(--gold);
  }
  .box svg{
    width:11px;
    height:11px;
    opacity:0;
    transform:scale(.5);
    transition:all .16s ease;
  }
  .item.done .box svg{ opacity:1; transform:scale(1); }

  .item-text{
    font-size:15px;
    line-height:1.35;
    padding-top:1px;
  }
  .icon-tag{
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    margin-right:7px;
    vertical-align:middle;
    position:relative;
    top:-1px;
  }
  .icon-water{ background:#7fb3c9; }
  .icon-pill{ background:#c98789; }
  .icon-skin{ background:#c9a15a; }
  .icon-body{ background:#a8867a; }
  .icon-coffee{ background:#8a6547; }
  .icon-read{ background:#8f8ab0; }
  .icon-plan{ background:#6f9d8f; }
  .icon-oral{ background:#6a93b0; }

  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--mauve);
    padding:9px 10px 2px;
  }

  .nutrition-card{
    background:var(--card);
    border:1px solid var(--divider);
    border-radius:16px;
    padding:14px 14px 10px;
    margin:6px 0 18px;
    box-shadow:var(--shadow);
  }
  .nutrition-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 14px;
  }
  .nutrition-field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .nutrition-field.full-span{
    grid-column:1 / -1;
  }
  .nutrition-label{
    font-size:11.5px;
    color:var(--muted);
    font-weight:500;
  }
  .nutrition-input-wrap{
    display:flex;
    align-items:baseline;
    gap:5px;
    border-bottom:1.5px solid var(--divider);
    padding-bottom:4px;
    transition:border-color .15s ease;
  }
  .nutrition-input-wrap:focus-within{
    border-color:var(--gold);
  }
  .nutrition-input-wrap input{
    border:none;
    outline:none;
    background:none;
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:500;
    color:var(--ink);
    width:100%;
    min-width:0;
    padding:0;
  }
  .nutrition-input-wrap input::-webkit-outer-spin-button,
  .nutrition-input-wrap input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .nutrition-unit{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    flex:0 0 auto;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    padding:26px 20px 10px;
    line-height:1.6;
  }
  footer a{ color: var(--mauve); }

  .reset-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:6px;
  }
  .reset-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    background:none;
    border:1px solid var(--divider);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .reset-btn:hover{ border-color:var(--mauve); color:var(--mauve); }

  .history-toggle{
    display:flex;
    justify-content:center;
    margin-top:10px;
  }
  .history-card{
    background:var(--card);
    border:1px solid var(--divider);
    border-radius:16px;
    padding:16px 14px;
    margin:14px 0;
    box-shadow:var(--shadow);
    display:none;
  }
  .history-card.open{ display:block; }
  .streak-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:14px;
  }
  .streak-num{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    color:var(--ink);
  }
  .streak-label{
    font-size:12.5px;
    color:var(--muted);
  }
  .heatmap-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:5px;
  }
  .heatmap-dow{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    color:var(--muted);
    text-align:center;
    padding-bottom:2px;
  }
  .heatmap-cell{
    aspect-ratio:1;
    border-radius:5px;
    background:var(--divider);
    position:relative;
  }
  .heatmap-cell[data-level="1"]{ background:var(--gold-soft); }
  .heatmap-cell[data-level="2"]{ background:var(--gold); }
  .heatmap-cell[data-level="3"]{ background:var(--mauve); }
  .heatmap-cell.today{ box-shadow:0 0 0 1.5px var(--ink) inset; }
  .heatmap-legend{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;
    margin-top:10px;
    font-size:10px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
  }
  .heatmap-legend .heatmap-cell{ width:11px; height:11px; aspect-ratio:unset; }

  .nutrient-table{
    width:100%;
    border-collapse:collapse;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
  }
  .nutrient-table th{
    font-weight:500;
    color:var(--muted);
    padding:4px 3px;
    text-align:center;
  }
  .nutrient-table td{
    padding:5px 3px;
    text-align:center;
    color:var(--ink);
    border-top:1px solid var(--divider);
  }
  .nutrient-row-label{
    text-align:left !important;
    color:var(--muted);
    font-family:'Inter', sans-serif;
    font-size:11.5px;
    font-weight:500;
  }
  .nutrient-avg{
    font-weight:600;
    color:var(--mauve);
    border-left:1px solid var(--divider);
  }

  .log-date-form{
    margin-top:4px;
  }
  .log-date-input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--divider);
    border-radius:10px;
    padding:9px 10px;
    margin-bottom:10px;
  }
  .log-date-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .log-date-field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .log-date-field span{
    font-size:11px;
    color:var(--muted);
    font-weight:500;
  }
  .log-date-field input{
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--divider);
    border-radius:10px;
    padding:8px 10px;
    width:100%;
  }
  .log-date-field input:focus, .log-date-input:focus{
    outline:none;
    border-color:var(--gold);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="dateLabel">Weekly Routine</p>
    <h1>Day in My Life</h1>
    <p class="sub" id="dayCount">Loading…</p>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="progress-line"><div class="progress-fill" id="progressFill"></div></div>

  <div id="list"></div>

  <div class="history-toggle">
    <button class="reset-btn" id="historyToggleBtn">View streak &amp; history</button>
  </div>
  <div class="history-card" id="historyCard">
    <div class="streak-row">
      <span class="streak-num" id="streakNum">0</span>
      <span class="streak-label">day streak</span>
    </div>
    <div class="heatmap-grid" id="heatmapGrid"></div>
    <div class="heatmap-legend">
      less
      <div class="heatmap-cell" data-level="0"></div>
      <div class="heatmap-cell" data-level="1"></div>
      <div class="heatmap-cell" data-level="2"></div>
      <div class="heatmap-cell" data-level="3"></div>
      more
    </div>
    <div class="section-label" style="padding:14px 0 6px;">Last 7 days</div>
    <div id="nutritionTrend"></div>

    <div class="section-label" style="padding:14px 0 6px;">Log for a date</div>
    <div class="log-date-form">
      <input type="date" id="logDateInput" class="log-date-input">
      <div class="log-date-grid">
        <label class="log-date-field">
          <span>Calories</span>
          <input type="number" min="0" inputmode="decimal" id="logCalories" placeholder="0">
        </label>
        <label class="log-date-field">
          <span>Protein (g)</span>
          <input type="number" min="0" inputmode="decimal" id="logProtein" placeholder="0">
        </label>
        <label class="log-date-field">
          <span>Fiber (g)</span>
          <input type="number" min="0" inputmode="decimal" id="logFiber" placeholder="0">
        </label>
        <label class="log-date-field">
          <span>Water (ml)</span>
          <input type="number" min="0" inputmode="decimal" id="logWater" placeholder="0">
        </label>
        <label class="log-date-field">
          <span>Steps</span>
          <input type="number" min="0" inputmode="decimal" id="logSteps" placeholder="0">
        </label>
      </div>
      <button class="reset-btn" id="logDateSaveBtn" style="width:100%;margin-top:8px;">Save entry</button>
    </div>
  </div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">Reset today</button>
    <button class="reset-btn" id="resetWeekBtn">Reset week</button>
  </div>

  <footer>
    A rhythm, not a rulebook — check things off as you go.<br>Progress saves automatically.
    <div id="storageDiag" style="margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);"></div>
  </footer>
</div>

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday","Cleaning"];
const SHORT = {Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thu",Friday:"Fri",Saturday:"Sat",Sunday:"Sun",Cleaning:"Clean"};

let checkedState = {}; // { "Monday:3:1": true }
let nutritionState = {}; // { "Monday": {calories, protein, fiber, water} }
let historyState = {}; // { "2026-09-20": {weekday:"Monday", done:8, total:11} }
let currentDay = DAYS[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1];

function actualWeekday(){
  return DAYS[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1];
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

const tabsEl = document.getElementById('tabs');
const listEl = document.getElementById('list');
const progressFill = document.getElementById('progressFill');
const dayCount = document.getElementById('dayCount');

function itemKey(day, blockIdx, itemIdx){
  return day + ':' + blockIdx + ':' + itemIdx;
}

function countTotals(day){
  let total = 0, done = 0;
  DATA[day].forEach((b, bi) => {
    b.items.forEach((it, ii) => {
      total++;
      if(checkedState[itemKey(day,bi,ii)]) done++;
    });
  });
  return {total, done};
}

function ringGradient(pct){
  const deg = Math.round(pct * 360);
  return `conic-gradient(var(--gold) 0deg ${deg}deg, #ece2e5 ${deg}deg 360deg)`;
}

function renderTabs(){
  tabsEl.innerHTML = '';
  DAYS.forEach(day => {
    const {total, done} = countTotals(day);
    const pct = total ? done/total : 0;
    const tab = document.createElement('div');
    tab.className = 'tab' + (day === currentDay ? ' active' : '');
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.background = pct >= 1
      ? 'var(--gold)'
      : ringGradient(pct);
    tab.appendChild(ring);
    const label = document.createElement('span');
    label.textContent = SHORT[day];
    tab.appendChild(label);
    tab.onclick = () => { currentDay = day; renderAll(); };
    tabsEl.appendChild(tab);
  });
}

function iconClass(icon){
  const map = { water:'icon-water', pill:'icon-pill', skin:'icon-skin', body:'icon-body', coffee:'icon-coffee', read:'icon-read', plan:'icon-plan', oral:'icon-oral' };
  return map[icon] || '';
}

    };
    inputWrap.appendChild(input);

    const unit = document.createElement('span');
    unit.className = 'nutrition-unit';
    unit.textContent = f.unit;
    inputWrap.appendChild(unit);

    field.appendChild(inputWrap);
    grid.appendChild(field);
  });

  card.appendChild(grid);
  return card;
}

function renderList(){
  listEl.innerHTML = '';
  DATA[currentDay].forEach((block, bi) => {
    const row = document.createElement('div');
    row.className = 'block';

    const timeCol = document.createElement('div');
    timeCol.className = 'time-col';
    timeCol.textContent = block.time;
    row.appendChild(timeCol);

    const rail = document.createElement('div');
    rail.className = 'rail';
    const dot = document.createElement('div');
    dot.className = 'rail-dot';
    rail.appendChild(dot);
    row.appendChild(rail);

    const itemsCol = document.createElement('div');
    itemsCol.className = 'items';

    if(block.nutrition){
      itemsCol.appendChild(renderNutritionCard(currentDay));
      row.appendChild(itemsCol);
      listEl.appendChild(row);
      return;
    }

    const sectionLabels = { skin: 'Skincare', body: 'Body care', pill: 'Supplements', plan: 'Planning', oral: 'Oral care' };
    let lastIcon = null;
    block.items.forEach((it, ii) => {
      if(sectionLabels[it.icon] && it.icon !== lastIcon){
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = sectionLabels[it.icon];
        itemsCol.appendChild(label);
      }
      lastIcon = it.icon;

      const key = itemKey(currentDay, bi, ii);
      const isDone = !!checkedState[key];
      const itemEl = document.createElement('div');
      itemEl.className = 'item' + (isDone ? ' done' : '');

      const box = document.createElement('div');
      box.className = 'box';
      box.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2L4.7 9L10 3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      itemEl.appendChild(box);

      const text = document.createElement('div');
      text.className = 'item-text';
      const tag = it.icon ? `<span class="icon-tag ${iconClass(it.icon)}"></span>` : '';
      text.innerHTML = tag + it.text;
      itemEl.appendChild(text);

      itemEl.onclick = () => {
        checkedState[key] = !checkedState[key];
        saveState();
        renderAll();
      };

      itemsCol.appendChild(itemEl);
    });

    row.appendChild(itemsCol);
    listEl.appendChild(row);
  });
}

function renderProgress(){
  const {total, done} = countTotals(currentDay);
  const pct = total ? (done/total)*100 : 0;
  progressFill.style.width = pct + '%';
  dayCount.textContent = `${currentDay} — ${done} of ${total} done`;
}

function renderAll(){
  renderTabs();
  renderList();
  renderProgress();
}

function loadState(){
  try{
    const raw = localStorage.getItem('checklist-state');
    if(raw) checkedState = JSON.parse(raw);
  }catch(e){ checkedState = {}; }
  try{
    const raw2 = localStorage.getItem('nutrition-state');
    if(raw2) nutritionState = JSON.parse(raw2);
  }catch(e){ nutritionState = {}; }
  try{
    const raw3 = localStorage.getItem('history-state');
    if(raw3) historyState = JSON.parse(raw3);
  }catch(e){ historyState = {}; }

  const diag = document.getElementById('storageDiag');
  if(diag){
    diag.textContent = testLocalStorage()
      ? 'On-device storage: working'
      : 'On-device storage: unavailable in this view — open from your Home Screen icon instead';
  }

  renderAll();
}

function testLocalStorage(){
  try{
    localStorage.setItem('__probe__', '1');
    localStorage.removeItem('__probe__');
    return true;
  }catch(e){
    return false;
  }
}

function saveWithRetry(key, value){
  try{
    localStorage.setItem(key, value);
    showSavedIndicator();
    return true;
  }catch(e){
    console.error('localStorage save failed', e);
    showSaveWarning();
    return false;
  }
}

function showSavedIndicator(){
  let ind = document.getElementById('savedIndicator');
  if(!ind){
    ind = document.createElement('div');
    ind.id = 'savedIndicator';
    ind.textContent = 'Saved';
    ind.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#6f9d8f;color:#fff;font-family:Inter,sans-serif;font-size:12.5px;text-align:center;padding:7px;z-index:999;opacity:0;transition:opacity .2s ease;pointer-events:none;';
    document.body.appendChild(ind);
  }
  ind.style.display = 'block';
  ind.style.opacity = '1';
  clearTimeout(ind._hideTimer);
  ind._hideTimer = setTimeout(() => { ind.style.opacity = '0'; }, 1200);
}

function showSaveWarning(){
  let warn = document.getElementById('saveWarning');
  if(!warn){
    warn = document.createElement('div');
    warn.id = 'saveWarning';
    warn.textContent = "Couldn't save — check your connection and try again.";
    warn.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#a8687a;color:#fff;font-family:Inter,sans-serif;font-size:13px;text-align:center;padding:10px;z-index:999;';
    document.body.appendChild(warn);
  }
  warn.style.display = 'block';
  clearTimeout(warn._hideTimer);
  warn._hideTimer = setTimeout(() => { warn.style.display = 'none'; }, 4000);
}

function saveState(){
  saveWithRetry('checklist-state', JSON.stringify(checkedState));
  snapshotHistory();
}

function saveNutrition(){
  saveWithRetry('nutrition-state', JSON.stringify(nutritionState));
  snapshotNutritionHistory();
}

// Only logs history when the tab being edited is TODAY's actual real-world
// weekday (not when filling in a different day's card to plan ahead), and
// never for the Cleaning tab, which has no fixed day mapping.
function snapshotHistory(){
  if(currentDay === 'Cleaning') return;
  if(currentDay !== actualWeekday()) return;
  const {total, done} = countTotals(currentDay);
  const existing = historyState[todayISO()] || {};
  historyState[todayISO()] = Object.assign({}, existing, {weekday: currentDay, done, total});
  saveWithRetry('history-state', JSON.stringify(historyState));
  if(document.getElementById('historyCard').classList.contains('open')) renderHistory();
}

function snapshotNutritionHistory(){
  if(currentDay === 'Cleaning') return;
  if(currentDay !== actualWeekday()) return;
  const dayData = nutritionState[currentDay] || {};
  const existing = historyState[todayISO()] || {};
  historyState[todayISO()] = Object.assign({}, existing, {
    weekday: currentDay,
    calories: dayData.calories || '',
    protein: dayData.protein || '',
    fiber: dayData.fiber || '',
    water: dayData.water || '',
    steps: dayData.steps || ''
  });
  saveWithRetry('history-state', JSON.stringify(historyState));
  if(document.getElementById('historyCard').classList.contains('open')) renderHistory();
}

function dayLevel(entry){
  if(!entry || !entry.total) return 0;
  const pct = entry.done / entry.total;
  if(pct <= 0) return 0;
  if(pct < 0.5) return 1;
  if(pct < 0.85) return 2;
  return 3;
}

function renderHistory(){
  const grid = document.getElementById('heatmapGrid');
  grid.innerHTML = '';

  // Build the last 35 days (5 full weeks), oldest first, aligned Mon-Sun.
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayDow = today.getDay() === 0 ? 6 : today.getDay() - 1; // 0=Mon
  const daysBack = todayDow + 7 * 4; // pad to full weeks ending today
  const start = new Date(today);
  start.setDate(start.getDate() - daysBack);

  const dowLabels = ['M','T','W','T','F','S','S'];
  dowLabels.forEach(l => {
    const el = document.createElement('div');
    el.className = 'heatmap-dow';
    el.textContent = l;
    grid.appendChild(el);
  });

  const cursor = new Date(start);
  const last7 = [];
  while(cursor <= today){
    const y = cursor.getFullYear();
    const m = String(cursor.getMonth()+1).padStart(2,'0');
    const d = String(cursor.getDate()).padStart(2,'0');
    const iso = `${y}-${m}-${d}`;
    const entry = historyState[iso];
    const cell = document.createElement('div');
    cell.className = 'heatmap-cell';
    cell.dataset.level = dayLevel(entry);
    if(iso === todayISO()) cell.classList.add('today');
    const titleBits = [];
    if(entry && entry.total) titleBits.push(`${entry.done}/${entry.total} done`);
    if(entry && entry.calories) titleBits.push(`${entry.calories} kcal`);
    if(entry && entry.water) titleBits.push(`${entry.water} ml water`);
    cell.title = titleBits.length ? `${iso}: ${titleBits.join(', ')}` : iso;
    grid.appendChild(cell);
    cursor.setDate(cursor.getDate() + 1);
  }

  document.getElementById('streakNum').textContent = computeStreak();
  renderNutritionTrend();
}

function renderNutritionTrend(){
  const container = document.getElementById('nutritionTrend');
  container.innerHTML = '';

  const metrics = [
    {key:'calories', label:'Cal', unit:'kcal'},
    {key:'protein', label:'Protein', unit:'g'},
    {key:'fiber', label:'Fiber', unit:'g'},
    {key:'water', label:'Water', unit:'ml'},
    {key:'steps', label:'Steps', unit:''}
  ];

  // last 7 days including today, oldest first
  const days = [];
  const cursor = new Date();
  cursor.setHours(0,0,0,0);
  cursor.setDate(cursor.getDate() - 6);
  for(let i = 0; i < 7; i++){
    const y = cursor.getFullYear();
    const m = String(cursor.getMonth()+1).padStart(2,'0');
    const d = String(cursor.getDate()).padStart(2,'0');
    days.push({iso: `${y}-${m}-${d}`, label: cursor.toLocaleDateString(undefined,{weekday:'short'})});
    cursor.setDate(cursor.getDate() + 1);
  }

  const table = document.createElement('table');
  table.className = 'nutrient-table';

  const headRow = document.createElement('tr');
  headRow.appendChild(document.createElement('th'));
  days.forEach(d => {
    const th = document.createElement('th');
    th.textContent = d.label;
    headRow.appendChild(th);
  });
  const avgTh = document.createElement('th');
  avgTh.textContent = 'Avg';
  headRow.appendChild(avgTh);
  table.appendChild(headRow);

  metrics.forEach(metric => {
    const row = document.createElement('tr');
    const labelCell = document.createElement('td');
    labelCell.className = 'nutrient-row-label';
    labelCell.textContent = metric.label;
    row.appendChild(labelCell);

    let sum = 0, count = 0;
    days.forEach(d => {
      const entry = historyState[d.iso];
      const val = entry ? entry[metric.key] : '';
      const cell = document.createElement('td');
      cell.textContent = val || '–';
      row.appendChild(cell);
      if(val){ sum += Number(val); count++; }
    });

    const avgCell = document.createElement('td');
    avgCell.className = 'nutrient-avg';
    avgCell.textContent = count ? Math.round(sum / count) : '–';
    row.appendChild(avgCell);

    table.appendChild(row);
  });

  container.appendChild(table);
}

// Consecutive days (counting back from today) where the day's checklist was
// at least 50% complete.
function computeStreak(){
  let streak = 0;
  const cursor = new Date();
  cursor.setHours(0,0,0,0);
  while(true){
    const y = cursor.getFullYear();
    const m = String(cursor.getMonth()+1).padStart(2,'0');
    const d = String(cursor.getDate()).padStart(2,'0');
    const iso = `${y}-${m}-${d}`;
    const entry = historyState[iso];
    if(entry && entry.total && (entry.done / entry.total) >= 0.5){
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

document.getElementById('historyToggleBtn').onclick = () => {
  const card = document.getElementById('historyCard');
  card.classList.toggle('open');
  if(card.classList.contains('open')){
    renderHistory();
    const dateInput = document.getElementById('logDateInput');
    if(!dateInput.value) dateInput.value = todayISO();
    loadLogDateFields();
  }
};

function loadLogDateFields(){
  const iso = document.getElementById('logDateInput').value;
  const entry = historyState[iso] || {};
  document.getElementById('logCalories').value = entry.calories || '';
  document.getElementById('logProtein').value = entry.protein || '';
  document.getElementById('logFiber').value = entry.fiber || '';
  document.getElementById('logWater').value = entry.water || '';
  document.getElementById('logSteps').value = entry.steps || '';
}

document.getElementById('logDateInput').onchange = loadLogDateFields;

document.getElementById('logDateSaveBtn').onclick = () => {
  const iso = document.getElementById('logDateInput').value;
  if(!iso) return;
  const existing = historyState[iso] || {};
  historyState[iso] = Object.assign({}, existing, {
    calories: document.getElementById('logCalories').value,
    protein: document.getElementById('logProtein').value,
    fiber: document.getElementById('logFiber').value,
    water: document.getElementById('logWater').value,
    steps: document.getElementById('logSteps').value
  });
  saveWithRetry('history-state', JSON.stringify(historyState));
  renderHistory();
};

document.getElementById('resetBtn').onclick = () => {
  DATA[currentDay].forEach((b, bi) => {
    b.items.forEach((it, ii) => {
      delete checkedState[itemKey(currentDay,bi,ii)];
    });
  });
  delete nutritionState[currentDay];
  saveState();
  saveNutrition();
  renderAll();
};

document.getElementById('resetWeekBtn').onclick = () => {
  checkedState = {};
  nutritionState = {};
  saveState();
  saveNutrition();
  renderAll();
};

loadState();
</script>
